              ("microg", "MicroG RE"),
              ("bilibili", "Bilibili")
          ]

          KNOWN_MODS = [
              ("revanced-extended", "ReVanced Extended"),
              ("revanced_extended", "ReVanced Extended"),
              ("revanced-experiments", "Revanced Experiments"),
              ("anddea", "ReVanced Extended (anddea)"),
              ("morphe", "Morphe"),
              ("biliroamingm", "BiliRoamingM"),
