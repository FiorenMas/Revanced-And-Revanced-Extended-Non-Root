name: 4. Sync Releases to Telegram

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  sync-mods:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y aapt
          pip install requests pyaxmlparser

      - name: Sync Releases to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import json
          import time
          import html
          import hashlib
          import subprocess
          from datetime import datetime
          import requests
          from pyaxmlparser import APK

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          TOPIC_ID = os.environ.get("TELEGRAM_TOPIC_ID")
          GH_TOKEN = os.environ.get("GH_TOKEN")

          # -------------------------------------------------------------
          # 0. Validate Required Telegram Secrets
          # -------------------------------------------------------------
          missing_secrets = []
          if not BOT_TOKEN or not BOT_TOKEN.strip():
              missing_secrets.append("TELEGRAM_BOT_TOKEN")
          if not CHAT_ID or not CHAT_ID.strip():
              missing_secrets.append("TELEGRAM_CHAT_ID")

          if missing_secrets:
              print("\n" + "=" * 60)
              print("❌ ERROR: Missing required secret(s):")
              for secret in missing_secrets:
                  print(f"   - {secret}")
              print("\nPlease add them in:")
              print("   Repository Settings -> Secrets and variables -> Actions")
              print("=" * 60 + "\n")
              sys.exit(1)

          REPO = "FiorenMas/Revanced-And-Revanced-Extended-Non-Root"
          TAG = "all"
          HASH_FILE = "sha256.json"

          headers = {
              "Accept": "application/vnd.github.v3+json"
          }
          if GH_TOKEN:
              headers["Authorization"] = f"Bearer {GH_TOKEN}"

          # -------------------------------------------------------------
          # 1. Verified App, Mod & Package Dictionaries
          # -------------------------------------------------------------
          KNOWN_APPS = [
              ("youtube-music", "YouTube Music"),
              ("youtubemusic", "YouTube Music"),
              ("youtube_music", "YouTube Music"),
              ("yt-music", "YouTube Music"),
              ("ytmusic", "YouTube Music"),
              ("ytm", "YouTube Music"),
              ("youtube", "YouTube"),
              ("yt-", "YouTube"),
              ("google-photos", "Google Photos"),
              ("googlephotos", "Google Photos"),
              ("gg-photos", "Google Photos"),
              ("ggphotos", "Google Photos"),
              ("photos", "Google Photos"),
              ("google-news", "Google News"),
              ("googlenews", "Google News"),
              ("gg-news", "Google News"),
              ("ggnews", "Google News"),
              ("google-recorder", "Google Recorder"),
              ("googlerecorder", "Google Recorder"),
              ("gg-recorder", "Google Recorder"),
              ("ggrecorder", "Google Recorder"),
              ("hola-vpn", "Hola VPN"),
              ("holavpn", "Hola VPN"),
